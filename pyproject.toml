[project]
name = "simple-comment-service"
version = "0.1.0"
description = "Serverless comment API: API Gateway + Lambda (Powertools) + DynamoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.31.0",
    "boto3>=1.43.40",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-ulid>=3.1.0",
]

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
root = ["src"]
