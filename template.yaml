AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  simple-comment-service: API Gateway (HTTP API) -> Lambda (Powertools) -> DynamoDB.
  Comment trees stored with a materialized-path single-table design.

Parameters:
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,http://localhost:5174
    Description: Origins allowed to call the API from a browser.

Globals:
  Function:
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256

Resources:
  CommentsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        AllowHeaders:
          - content-type
          - x-user-id
        MaxAge: 600

  CommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Environment:
        Variables:
          TABLE_NAME: !Ref CommentsTable
          POWERTOOLS_SERVICE_NAME: comments
          POWERTOOLS_METRICS_NAMESPACE: SimpleCommentService
          POWERTOOLS_LOG_LEVEL: INFO
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsApi
            Method: ANY
            Path: /{proxy+}
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.13-arm64

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Comments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub 'https://${CommentsApi}.execute-api.${AWS::Region}.amazonaws.com'
